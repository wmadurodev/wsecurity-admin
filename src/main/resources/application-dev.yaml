# Perfil de desenvolvimento local (RNF-OPE-01, RF-INF-03): padrões de 04 §5 para rodar o BFF na IDE, com o IdP em
# http://localhost:9000 e a autorização em http://localhost:9100 (make up-app SEM_ADMIN=sim no wsecurity-infra).
# As credenciais dos clientes do console vêm de code/wsecurity-infra/.local/console-admin.env (veja o README).
wsecurity:
  admin:
    idp:
      issuer: ${WSECURITY_ADMIN_IDP_ISSUER:http://localhost:9000}
      internal-uri: ${WSECURITY_ADMIN_IDP_INTERNAL_URI:${WSECURITY_ADMIN_IDP_ISSUER:http://localhost:9000}}
    authz:
      uri: ${WSECURITY_ADMIN_AUTHZ_URI:http://localhost:9100}
    public-uri: ${WSECURITY_ADMIN_PUBLIC_URI:http://localhost:9200}

server:
  servlet:
    session:
      cookie:
        # HTTP local: sem Secure e, por isso, sem o prefixo __Host-.
        name: WSADMIN_SESSION
        secure: false
  # O proxy do Vite (5174) repassa X-Forwarded-*; só em dev o BFF confia neles (RNF-OPE-04).
  forward-headers-strategy: framework

logging:
  level:
    dev.wmaduro.wsecurity: DEBUG
