spring:
  application:
    name: wsecurity-admin
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  thymeleaf:
    # Templates só para as páginas do BFF fora da SPA (RF-AUT-07).
    check-template-location: false

server:
  port: ${WSECURITY_ADMIN_PORT:9200}
  shutdown: graceful
  servlet:
    session:
      # RNF-SEG-01, DEC-09: nome próprio (não colide com os cookies do IdP em localhost), HttpOnly, SameSite=Lax.
      # Fora de dev, Secure e com o prefixo __Host-. Expiração: SessionLifetime (session.idle-timeout e max-age).
      tracking-modes: cookie
      cookie:
        name: __Host-WSADMIN_SESSION
        http-only: true
        secure: true
        same-site: lax
        path: /
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false
    include-binding-errors: never
  # O Tomcat (RemoteIpValve) só aceita X-Forwarded-* vindos de proxies confiáveis (por padrão, redes privadas e
  # loopback).
  forward-headers-strategy: native

management:
  server:
    port: ${WSECURITY_ADMIN_MANAGEMENT_PORT:9201}
  endpoints:
    web:
      exposure:
        # RNF-SEG-06: só health e info, e só na porta de gerenciamento.
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        # RNF-OPE-02: a readiness não depende das APIs (o console sobe e mostra o erro se o IdP estiver fora do ar).
        readiness:
          include: readinessState
  tracing:
    sampling:
      probability: ${WSECURITY_ADMIN_TRACING_SAMPLING:1.0}
  otlp:
    metrics:
      export:
        # Sem coletor de métricas nesta fase. Traces só são exportados com o endpoint OTLP configurado
        # (MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT).
        enabled: false

# Configuração do console (04 §5). Os padrões locais ficam em application-dev.yaml; em prod, application-prod.yaml
# exige as variáveis.
wsecurity:
  admin:
    idp:
      issuer: ${WSECURITY_ADMIN_IDP_ISSUER:}
      internal-uri: ${WSECURITY_ADMIN_IDP_INTERNAL_URI:${WSECURITY_ADMIN_IDP_ISSUER:}}
    authz:
      uri: ${WSECURITY_ADMIN_AUTHZ_URI:}
    client:
      id: ${WSECURITY_ADMIN_CLIENT_ID:}
      secret: ${WSECURITY_ADMIN_CLIENT_SECRET:}
    service-client:
      id: ${WSECURITY_ADMIN_SERVICE_CLIENT_ID:}
      secret: ${WSECURITY_ADMIN_SERVICE_CLIENT_SECRET:}
    public-uri: ${WSECURITY_ADMIN_PUBLIC_URI:}
    session:
      idle-timeout: ${WSECURITY_ADMIN_SESSION_IDLE_TIMEOUT:30m}
      max-age: ${WSECURITY_ADMIN_SESSION_MAX_AGE:12h}
    proxy:
      connect-timeout: ${WSECURITY_ADMIN_PROXY_CONNECT_TIMEOUT:2s}
      read-timeout: ${WSECURITY_ADMIN_PROXY_READ_TIMEOUT:10s}
